<!-- corp 2+1 -->
<rect x="270" y="250" width="95" height="80" class="strict"/><rect x="270" y="210" width="95" height="40" class="unk"/><text x="317" y="198" text-anchor="middle" class="n">3</text><text x="317" y="355" text-anchor="middle" class="l">Corp Wi-Fi</text>
