<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410">
<style>text{font-family:Arial,sans-serif;fill:#222}.t{font-size:20px;font-weight:bold}.l{font-size:13px}.n{font-size:14px;font-weight:bold}.strict{fill:#4b5563}.unk{fill:#9ca3af}.inv{fill:#d1d5db}.axis{stroke:#555;stroke-width:1}</style>
<text x="380" y="30" text-anchor="middle" class="t">Estado de evidencia por zona de origen</text>
