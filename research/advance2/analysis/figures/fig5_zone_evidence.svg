<rect x="580" y="250" width="95" height="80" class="strict"/><rect x="580" y="210" width="95" height="40" class="unk"/><text x="627" y="198" text-anchor="middle" class="n">3</text><text x="627" y="355" text-anchor="middle" class="l">Hospitalstaff</text>
<rect x="210" y="382" width="18" height="10" class="strict"/><text x="235" y="391" class="l">P=C=O</text>
