<rect x="425" y="290" width="95" height="40" class="unk"/><rect x="425" y="250" width="95" height="40" class="inv"/><text x="472" y="238" text-anchor="middle" class="n">2</text><text x="472" y="355" text-anchor="middle" class="l">Management</text>
